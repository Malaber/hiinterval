name: Reusable iOS checks

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  swift_package:
    name: Swift package + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Run tests and coverage gate
        run: ios/HiIntervalIOS/Scripts/check_coverage.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage
          retention-days: 14
          if-no-files-found: warn
          path: ios/HiIntervalIOS/coverage

  ios_ui_e2e:
    name: XCUITest · ${{ matrix.platform }} · shard ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 50
    env:
      HIINTERVAL_UI_SHARD_INDEX: ${{ matrix.shard }}
      HIINTERVAL_UI_SHARD_COUNT: 3
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        platform: [iPhone, iPad]
        shard: [0, 1, 2]
        include:
          - platform: iPhone
            device_name: iPhone 17 Pro Max
            artifact_dir: e2e-artifacts/ios-iphone
            artifact_name: ios-ui-e2e-iphone
          - platform: iPad
            device_name: iPad Pro 13-inch (M5)
            artifact_dir: e2e-artifacts/ios-ipad
            artifact_name: ios-ui-e2e-ipad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install task runner
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install XcodeGen
        run: python -m invoke install-xcodegen
      - name: Validate CI helpers
        run: python -m unittest discover -s ios/HiIntervalIOS/Scripts -p 'test_*.py'
      - name: Show native toolchain
        run: xcodebuild -version && xcodegen --version
      - name: Run serial ${{ matrix.platform }} UI shard ${{ matrix.shard }}
        id: ui_tests
        run: >-
          python ios/HiIntervalIOS/Scripts/run_with_timeout.py 2100
          python -m invoke ios-ui-e2e
          --device-name="${{ matrix.device_name }}"
          --artifact-dir="${{ matrix.artifact_dir }}"
          --only-testing=HiIntervalUITests
      - name: Upload ${{ matrix.platform }} UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ matrix.artifact_dir }}
      - name: Upload App Store marketing screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-${{ matrix.platform }}-${{ matrix.shard }}
          path: ${{ matrix.artifact_dir }}/marketing/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add ${{ matrix.platform }} result summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.ui_tests.outcome }}
        run: |
          echo "UI shard outcome: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${{ matrix.artifact_dir }}/summary.md" ]; then
            cat "${{ matrix.artifact_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
