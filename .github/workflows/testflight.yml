name: TestFlight

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Run all checks, then upload signed build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  manual_checks:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
    uses: ./.github/workflows/ios-checks.yml

  upload:
    name: Signed archive + upload
    needs:
      - manual_checks
    if: >-
      always() &&
      github.repository_owner == 'Malaber' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.TESTFLIGHT_UPLOAD_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_to_testflight &&
          needs.manual_checks.result == 'success'
        )
      )
    runs-on: macos-26
    timeout-minutes: 35
    environment: testflight
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'VWKG94374J' }}
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'de.malaber.hiinterval' }}
      IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION || '0.1.0' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify checked-out commit is current main tip
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checked_out_commit=$(git rev-parse HEAD)
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [ "$checked_out_commit" != "$EXPECTED_COMMIT" ]; then
            echo "Checkout mismatch: $checked_out_commit != $EXPECTED_COMMIT" >&2
            exit 1
          fi
          if [ "$checked_out_commit" != "$current_main" ]; then
            echo "Refusing stale TestFlight build: $checked_out_commit != $current_main" >&2
            exit 1
          fi
      - name: Compute artifact paths
        id: artifact
        run: |
          base="HiInterval-$IOS_MARKETING_VERSION-$IOS_BUILD_NUMBER"
          delivery_dir="$RUNNER_TEMP/delivery"
          mkdir -p "$delivery_dir"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "delivery_dir=$delivery_dir" >> "$GITHUB_OUTPUT"
          echo "archive_path=$RUNNER_TEMP/$base.xcarchive" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/hiinterval-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Validate delivery configuration
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for variable in \
            APPLE_TEAM_ID \
            IOS_BUNDLE_IDENTIFIER \
            APP_STORE_CONNECT_APP_ID \
            KEYCHAIN_PASSWORD \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY
          do
            if [ -z "${!variable:-}" ]; then
              echo "Missing TestFlight setting: $variable" >&2
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install delivery tools
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m invoke install-xcodegen
      - name: Generate Xcode project
        run: python -m invoke generate-ios-project
      - name: Install signing certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/hiinterval-distribution.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
      - name: Install provisioning profile
        id: profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          profile_path="$RUNNER_TEMP/hiinterval.mobileprovision"
          profile_plist="$RUNNER_TEMP/hiinterval-profile.plist"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_path="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_path"
          echo "uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "installed_path=$installed_path" >> "$GITHUB_OUTPUT"
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$key_dir/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
      - name: Archive signed app
        working-directory: ios/HiIntervalIOS
        run: |
          xcodebuild \
            -project HiIntervalApp.xcodeproj \
            -scheme HiInterval \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${{ steps.artifact.outputs.archive_path }}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            HIINTERVAL_APP_PROFILE_NAME='${{ steps.profile.outputs.uuid }}' \
            archive \
            2>&1 | tee "${{ steps.artifact.outputs.delivery_dir }}/archive.log"
      - name: Export App Store IPA
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_IDENTIFIER}</key>
              <string>${{ steps.profile.outputs.uuid }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          export_dir="$RUNNER_TEMP/app-store-export"
          xcodebuild \
            -exportArchive \
            -archivePath "${{ steps.artifact.outputs.archive_path }}" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$export_options" \
            2>&1 | tee "${{ steps.artifact.outputs.delivery_dir }}/export.log"
          ipa_path=$(find "$export_dir" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          if [ -z "$ipa_path" ]; then
            echo 'Export produced no IPA' >&2
            exit 1
          fi
          cp "$ipa_path" \
            "${{ steps.artifact.outputs.delivery_dir }}/${{ steps.artifact.outputs.base }}.ipa"
      - name: Reconfirm exported build is current main tip
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main=$(git rev-parse refs/remotes/origin/main)
          built_commit=$(git rev-parse HEAD)
          if [ "$built_commit" != "$current_main" ]; then
            echo "Refusing stale TestFlight upload: $built_commit != $current_main" >&2
            exit 1
          fi
      - name: Preserve signed delivery artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.base }}-signed
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ steps.artifact.outputs.delivery_dir }}
            ${{ steps.artifact.outputs.archive_path }}
      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-package "${{ steps.artifact.outputs.delivery_dir }}/${{ steps.artifact.outputs.base }}.ipa" \
            --platform ios \
            --apple-id "$APP_STORE_CONNECT_APP_ID" \
            --bundle-id "$IOS_BUNDLE_IDENTIFIER" \
            --bundle-version "$IOS_BUILD_NUMBER" \
            --bundle-short-version-string "$IOS_MARKETING_VERSION" \
            --team-id "$APPLE_TEAM_ID" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f '${{ steps.profile.outputs.installed_path }}'
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          rm -f \
            "$RUNNER_TEMP/hiinterval-distribution.p12" \
            "$RUNNER_TEMP/hiinterval.mobileprovision" \
            "$RUNNER_TEMP/hiinterval-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
