name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep a result for each pushed revision; duplicate runs of the same revision may cancel.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ios_checks:
    uses: ./.github/workflows/ios-checks.yml

  release_tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
