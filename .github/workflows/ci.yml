name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep a result for each pushed revision; duplicate runs of the same revision may cancel.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ios_checks:
    uses: ./.github/workflows/ios-checks.yml
